<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F1A"></stop>
      <stop offset="100%" stop-color="#111827"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"></stop>
      <stop offset="100%" stop-color="#A78BFA"></stop>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="360" fill="url(#bg)"></rect>

  <!-- Subtle network / shard mesh -->
  <g opacity="0.22">
    <path d="M80 80 L320 150 L560 110 L820 180 L1120 140 L1320 190" stroke="#60A5FA" stroke-width="2" fill="none"></path>
    <path d="M100 260 L360 210 L620 270 L900 220 L1180 260" stroke="#A78BFA" stroke-width="2" fill="none"></path>

    <circle cx="320" cy="150" r="7" fill="#60A5FA"></circle>
    <circle cx="560" cy="110" r="7" fill="#60A5FA"></circle>
    <circle cx="820" cy="180" r="7" fill="#60A5FA"></circle>
    <circle cx="360" cy="210" r="7" fill="#A78BFA"></circle>
    <circle cx="620" cy="270" r="7" fill="#A78BFA"></circle>
    <circle cx="900" cy="220" r="7" fill="#A78BFA"></circle>
  </g>

  <!-- Title block -->
  <g filter="url(#softGlow)">
    <text x="90" y="150" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="76" font-weight="800" fill="#F9FAFB" letter-spacing="1">
      SBMPI
    </text>

    <text x="92" y="205" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="600" fill="url(#accent)">
      Parallelizing Blockchain Computations via Sharding
    </text>

    <text x="92" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="18" fill="#9CA3AF">
      C++ • MPI • PBFT • Sharded Consensus • Parallel Systems
    </text>
  </g>

  <!-- Pill descriptor -->
  <g>
    <rect x="92" y="270" rx="18" ry="18" width="560" height="38" fill="#0F172A" stroke="#374151"></rect>
    <text x="112" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16" fill="#E5E7EB">
      High-performance distributed systems simulation • Research project
    </text>
  </g>
</svg>
